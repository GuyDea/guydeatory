# Publishes theguydea.com on every push to main: checks, builds, uploads to S3, invalidates
# CloudFront (scripts/deploy.sh). AWS access comes from a short-lived GitHub OIDC token that only
# this repository's main branch can exchange for the guydeatory-github-deploy role; no keys are
# stored in GitHub. The role is defined in infra/site.template.yml.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token that AWS trusts

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::902325674644:role/guydeatory-github-deploy
          aws-region: us-east-1
      - run: npm run deploy
